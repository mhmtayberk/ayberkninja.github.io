title: ayberk.ninja
description: "Application security, AWS security, cloud security and AI security research in English and Turkish."
markdown: kramdown
url: "https://ayberk.ninja"
baseurl: ""
lang: en
locale: en_US
timezone: Europe/Istanbul
asset_version: "20260810-1"

author:
  name: Mehmet Ayberk
  url: "https://ayberk.ninja/about.html"
  twitter: mhmtayberk

logo: /assets/ninja.png

twitter:
  username: mhmtayberk
  card: summary

social:
  name: Mehmet Ayberk
  links:
    - https://github.com/mhmtayberk
    - https://twitter.com/mhmtayberk
    - https://www.linkedin.com/in/mhmtayberk/

plugins:
  - jemoji
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

collections_dir: all_collections
collections:
  posts:
    output: true
  projects:
    output: true

defaults:
  - scope:
      path: ""
    values:
      layout: "post"
  - scope:
      path: "_posts"
    values:
      layout: "post"
      permalink: /posts/:categories/:year/:month/:day/:title/
  - scope:
      path: "markdown-mirrors"
    values:
      sitemap: false
      
webrick:
  headers:
    X-XSS-Protection: 1

include: [".well-known"]
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - font-awesome
  - screenshots
  - scripts
