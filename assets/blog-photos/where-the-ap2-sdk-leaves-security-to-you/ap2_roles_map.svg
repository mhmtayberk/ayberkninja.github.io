<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#5c6b6a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="400" fill="#101417"/>

  <text x="40" y="38" fill="#72b6b5" font-size="14" font-weight="700">// roles and the mandate flow</text>

  <!-- Trusted Surface -->
  <rect x="246" y="58" width="188" height="50" fill="none" stroke="#72b6b5" stroke-width="1"/>
  <text x="340" y="80" fill="#a79e8b" font-size="13" text-anchor="middle">trusted surface</text>
  <text x="340" y="98" fill="#5c6b6a" font-size="11" text-anchor="middle">user signs mandates</text>

  <!-- Shopping Agent -->
  <rect x="246" y="174" width="188" height="50" fill="none" stroke="#a79e8b" stroke-width="1"/>
  <text x="340" y="196" fill="#a79e8b" font-size="13" text-anchor="middle">shopping agent</text>
  <text x="340" y="214" fill="#5c6b6a" font-size="11" text-anchor="middle">carries the mandates</text>

  <!-- signs -> agent -->
  <line x1="340" y1="108" x2="340" y2="172" stroke="#5c6b6a" stroke-width="1" marker-end="url(#ar2)"/>
  <text x="350" y="145" fill="#5c6b6a" font-size="10">signed mandates</text>

  <!-- verifier row: three boxes, same geometry -->
  <!-- Credential Provider -->
  <rect x="40" y="300" width="188" height="54" fill="none" stroke="#72b6b5" stroke-width="1"/>
  <text x="134" y="324" fill="#a79e8b" font-size="12" text-anchor="middle">credential provider</text>
  <text x="134" y="342" fill="#8fb9b2" font-size="11" text-anchor="middle">[verifies]</text>

  <!-- Merchant -->
  <rect x="246" y="300" width="188" height="54" fill="none" stroke="#72b6b5" stroke-width="1"/>
  <text x="340" y="324" fill="#a79e8b" font-size="12" text-anchor="middle">merchant</text>
  <text x="340" y="342" fill="#8fb9b2" font-size="11" text-anchor="middle">[verifies]</text>

  <!-- Merchant Payment Processor -->
  <rect x="452" y="300" width="188" height="54" fill="none" stroke="#72b6b5" stroke-width="1"/>
  <text x="546" y="324" fill="#a79e8b" font-size="12" text-anchor="middle">payment processor</text>
  <text x="546" y="342" fill="#8fb9b2" font-size="11" text-anchor="middle">[verifies]</text>

  <!-- agent bottom edge: two exits, symmetric around center (340) -->
  <!-- exit left (x=300) -> credential provider -->
  <path d="M300 224 L300 262 L134 262 L134 298" fill="none" stroke="#5c6b6a" stroke-width="1" marker-end="url(#ar2)"/>
  <text x="140" y="282" fill="#5c6b6a" font-size="10">payment mandates</text>

  <!-- exit center/right (x=380) -> merchant -->
  <path d="M380 224 L380 262 L340 262 L340 298" fill="none" stroke="#5c6b6a" stroke-width="1" marker-end="url(#ar2)"/>
  <text x="392" y="282" fill="#5c6b6a" font-size="10">token + checkout</text>

  <!-- merchant -> payment processor -->
  <line x1="434" y1="327" x2="450" y2="327" stroke="#5c6b6a" stroke-width="1" marker-end="url(#ar2)"/>

  <!-- caption -->
  <text x="40" y="384" fill="#5c6b6a" font-size="11">// three independent verification points: credential provider, merchant, payment processor</text>
</svg>
