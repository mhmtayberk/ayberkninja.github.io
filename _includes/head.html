<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {% seo %}
  {% feed_meta %}
  <meta name="robots" content="{% if page.robots %}{{ page.robots }}{% else %}index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1{% endif %}" />
  <meta name="theme-color" content="#101417" />
  {% assign markdown_mirror = page.markdown_mirror %}
  {% if page.collection == 'posts' %}
    {% assign markdown_mirror = page.url | append: '.md' %}
  {% endif %}
  {% if markdown_mirror %}
  <link rel="alternate" type="text/markdown" href="{{ markdown_mirror | absolute_url }}" title="Markdown version" />
  {% endif %}
  <link rel="describedby" href="{{ '/llms.txt' | absolute_url }}" type="text/plain" />

  <link rel="stylesheet" href="{{ '/assets/css/mark.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}" />

  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/favicon/apple-touch-icon.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicon/favicon-16x16.png' | relative_url }}">
  <link rel="manifest" href="{{ '/assets/favicon/site.webmanifest' | relative_url }}">

  <script src="{{ '/assets/js/pill.min.js' | relative_url }}"></script>
</head>
