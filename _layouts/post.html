<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">
  {% include head.html %}
  <body>
    <div id="indicator"></div>
    <div id="reading-progress" aria-hidden="true"></div>
    <div id="page">
      <style>
        .title {
          padding: 6.5%;
          color: #101417;
          font-size: 18px;
          font-weight: bold;
          text-align: center;
          background: #08CACA;
          display: grid;
        }
        .meta {
          font-size: 0.9rem;
          line-height: 1.6;
          font-weight: normal;
          text-transform: uppercase;
        }
        .imgCenter {
          display: block;
          margin-left: auto;
          margin-right: auto;
        }
      </style>
      <!-- header -->
      {% include header.html %}
      <!-- nav -->
      {% include nav.html %}
      <!-- page content -->
      <main class="content post-layout">
        <article class="post-article">
          <h1 class="title">
            {{ page.title }}
          </h1>
          <p class="meta">
            <span>{{ page.author | default: site.author.name }}</span>
            <span aria-hidden="true">·</span>
            <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
            <span aria-hidden="true">·</span>
            {% include reading-time.html %}
          </p>
          <aside class="table-of-contents" aria-label="Table of contents">
            <details>
              <summary>On this page</summary>
              <nav aria-label="Article sections">
                <ol></ol>
              </nav>
            </details>
          </aside>
          <div class="post-body">
            {{ content }}
          </div>
        </article>
      </main>

      <!-- footer -->
      {% include footer.html %}
    </div>
  </body>
</html>
